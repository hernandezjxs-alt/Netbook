<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141414">
  <title>Netbook</title>
  <link rel="stylesheet" href="style.css?v=__V__">
</head>
<body>

  <!-- Login -->
  <main id="auth" class="auth" hidden>
    <form id="auth-form" class="auth-card" autocomplete="on">
      <h1 class="logo">NETBOOK</h1>
      <p class="muted">Tu biblioteca de PDFs</p>
      <label>Usuario (correo)
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label>Contraseña
        <input id="password" type="password" autocomplete="current-password" minlength="6" required>
      </label>
      <button class="btn primary" type="submit">Entrar</button>
      <hr class="sep">
      <label>Nombre de usuario <span class="hint">(opcional, solo al crear cuenta)</span>
        <input id="username" type="text" maxlength="40" autocomplete="nickname">
      </label>
      <button id="btn-signup" class="btn ghost" type="button">Crear cuenta</button>
      <p id="auth-msg" class="msg" role="status"></p>
    </form>
  </main>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <h1 class="logo">NETBOOK</h1>
      <input id="search" class="search" type="search" placeholder="Buscar título, autor o categoría…" aria-label="Buscar">
      <button id="btn-upload" class="btn primary" type="button">+ Subir PDF</button>
      <span id="user-badge" class="badge" hidden></span>
      <button id="btn-logout" class="btn ghost" type="button">Salir</button>
    </header>

    <nav id="filters" class="filters" hidden aria-label="Filtros por etiqueta">
      <div id="chips" class="chips"></div>
      <div class="filter-actions">
        <button id="btn-autotag" class="btn ghost small" type="button" hidden>✨ Etiquetar automático</button>
        <button id="btn-select" class="btn ghost small" type="button">Seleccionar</button>
      </div>
    </nav>

    <section id="hero" class="hero" hidden>
      <img id="hero-img" alt="" class="hero-bg">
      <div class="hero-shade"></div>
      <div class="hero-body">
        <p id="hero-kicker" class="kicker"></p>
        <h2 id="hero-title"></h2>
        <p id="hero-author" class="muted"></p>
        <button id="hero-btn" class="btn light" type="button">▶ Leer</button>
      </div>
    </section>

    <div id="empty" class="empty" hidden>
      <h2>Tu biblioteca está vacía</h2>
      <p class="muted">Sube tu primer PDF para empezar.</p>
      <button id="btn-upload-empty" class="btn primary" type="button">+ Subir PDF</button>
    </div>

    <main id="rows"></main>
  </div>

  <!-- Modal de subida -->
  <div id="upload-modal" class="modal" hidden>
    <form id="upload-form" class="modal-card">
      <h2>Subir PDF</h2>
      <label>Archivos PDF (puedes elegir varios, máx. 50 MB c/u)
        <input id="up-file" type="file" accept="application/pdf,.pdf" multiple required>
      </label>
      <div id="single-fields" class="fields">
        <label>Título
          <input id="up-title" type="text" maxlength="200" required>
        </label>
        <label>Autor
          <input id="up-author" type="text" maxlength="200">
        </label>
      </div>
      <label>Categoría (para todos los archivos de esta subida)
        <input id="up-category" type="text" maxlength="60" list="category-list" value="General" required>
        <datalist id="category-list"></datalist>
      </label>
      <label>Etiquetas (rol o género, separadas por coma)
        <input id="up-tags" type="text" maxlength="200" placeholder="Analista de datos, IT">
      </label>
      <div id="up-tag-sugs" class="sugs"></div>
      <label class="check"><input id="up-autotags" type="checkbox" checked> Sugerir etiquetas según el título</label>
      <p id="up-status" class="msg" role="status"></p>
      <p id="up-summary" class="summary" role="status" hidden></p>
      <ul id="up-report" class="report" hidden></ul>
      <div class="modal-actions">
        <button id="up-copy" class="btn ghost" type="button" hidden>Copiar informe</button>
        <button id="up-cancel" class="btn ghost" type="button">Cancelar</button>
        <button id="up-submit" class="btn primary" type="submit">Subir</button>
      </div>
    </form>
  </div>

  <!-- Modal para etiquetar varios libros -->
  <div id="tag-modal" class="modal top" hidden>
    <form id="tag-form" class="modal-card">
      <h2>Etiquetar <span id="tg-count"></span></h2>
      <label>Etiquetas a agregar (separadas por coma)
        <input id="tg-tags" type="text" maxlength="200" placeholder="Analista BI" required>
      </label>
      <div id="tg-sugs" class="sugs"></div>
      <p id="tg-status" class="msg" role="status"></p>
      <div class="modal-actions">
        <button id="tg-cancel" class="btn ghost" type="button">Cancelar</button>
        <button class="btn primary" type="submit">Agregar</button>
      </div>
    </form>
  </div>

  <!-- Confirmación propia (confirm() del navegador falla en algunos móviles) -->
  <div id="confirm-modal" class="modal top" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="cf-title">
      <h2 id="cf-title"></h2>
      <div id="cf-body" class="cf-body"></div>
      <div class="modal-actions">
        <button id="cf-cancel" class="btn ghost" type="button">Cancelar</button>
        <button id="cf-ok" class="btn primary" type="button">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- Modal de edición (se muestra sobre el lector) -->
  <div id="edit-modal" class="modal top" hidden>
    <form id="edit-form" class="modal-card">
      <h2>Editar libro</h2>
      <label>Título
        <input id="ed-title" type="text" maxlength="200" required>
      </label>
      <label>Autor
        <input id="ed-author" type="text" maxlength="200">
      </label>
      <label>Categoría
        <input id="ed-category" type="text" maxlength="60" list="category-list" required>
      </label>
      <label>Etiquetas (separadas por coma)
        <input id="ed-tags" type="text" maxlength="200" placeholder="Analista de datos, IT">
      </label>
      <div id="ed-tag-sugs" class="sugs"></div>
      <p id="ed-status" class="msg" role="status"></p>
      <div class="modal-actions">
        <button id="ed-cancel" class="btn ghost" type="button">Cancelar</button>
        <button class="btn primary" type="submit">Guardar</button>
      </div>
    </form>
  </div>

  <!-- Lector -->
  <div id="reader" class="reader" hidden>
    <div class="reader-bar">
      <button id="rd-close" class="icon" type="button" aria-label="Cerrar lector">✕</button>
      <span id="rd-title" class="rd-title"></span>
      <div class="rd-controls">
        <button id="rd-prev" class="icon" type="button" aria-label="Página anterior">‹</button>
        <input id="rd-page" type="number" min="1" value="1" aria-label="Página">
        <span id="rd-total" class="muted">/ 1</span>
        <button id="rd-next" class="icon" type="button" aria-label="Página siguiente">›</button>
        <button id="rd-zoom-out" class="icon" type="button" aria-label="Alejar">−</button>
        <span id="rd-zoom" class="muted">100%</span>
        <button id="rd-zoom-in" class="icon" type="button" aria-label="Acercar">+</button>
        <button id="rd-edit" class="icon" type="button" aria-label="Editar título y autor" title="Editar título y autor">✎</button>
        <button id="rd-delete" class="icon danger" type="button" aria-label="Eliminar libro" title="Eliminar libro">🗑</button>
      </div>
    </div>
    <div id="stage" class="stage">
      <p id="rd-status" class="muted"></p>
      <canvas id="page-canvas"></canvas>
    </div>
  </div>

  <!-- Barra del modo selección -->
  <div id="selbar" class="selbar" hidden>
    <span id="sel-count">0 seleccionados</span>
    <button id="sel-all" class="btn ghost small" type="button">Todos los visibles</button>
    <button id="sel-tag" class="btn primary small" type="button" disabled>Etiquetar</button>
    <button id="sel-cancel" class="btn ghost small" type="button">Cancelar</button>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="config.js?v=__V__"></script>
  <script src="meta.js?v=__V__"></script>
  <script src="app.js?v=__V__"></script>
</body>
</html>
